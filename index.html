<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>北區車上台保養查詢系統</title>

  <style>
body {
  font-family: "Arial", sans-serif;
  background: #f4f6f9;
  padding: 20px;
  color: #333;
}

.container {
  max-width: 1100px;
  margin: auto;
  background: white;
  padding: 20px;
  border-radius: 12px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.08);
}

h2 {
  margin-bottom: 15px;
}

input {
  padding: 10px;
  width: 300px;
  border: 1px solid #ccc;
  border-radius: 8px;
}

button {
  padding: 10px 15px;
  margin-left: 5px;
  border: none;
  border-radius: 8px;
  background: #3498db;
  color: white;
}

table {
  width: 100%;
  margin-top: 20px;
  border-collapse: collapse;
  table-layout: fixed;
}

td, th {
  white-space: normal;
  word-break: break-word;
}

th, td {
  border: 1px solid #eee;
  padding: 10px;
  text-align: center;
  font-size: 14px;
}

th {
  background: #f1f3f5;
}

th:nth-child(1),
td:nth-child(1) {
  width: 80px;
}

.ok { color: green; font-weight: bold; }
.no { color: red; font-weight: bold; }

  </style>
</head>

<body>

<div class="container">

<h2>🚗 北區車上台保養查詢</h2>

<div id="stats" style="margin:10px 0; font-size:16px;">
  已保養：<span id="okCount">0</span> 台　
  未保養：<span id="noCount">0</span> 台
</div>

<input type="text" id="search" placeholder="輸入車輛號碼">
<button onclick="search()">搜尋</button>

<table>
  <thead>
    <tr>
      <th>車輛號碼</th>
      <th>RAIDO 1 ID</th>
      <th>RAIDO 2 ID</th>
      <th>狀態</th>
      <th>保養日期</th>
      <th>保養人員</th>
      <th>備註</th>
    </tr>
  </thead>
  <tbody id="tbody"></tbody>
</table>

</div>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<script>
let allData = [];

function loadData() {
  fetch("https://docs.google.com/spreadsheets/d/e/2PACX-1vQ3uHor4OrU-UeJn83mwQ2HOis4iVD_-6Ia8QNbPtrirGep1KSfdz6f78ZUelaN9P5K0WRxdjgI59a1/pub?gid=327091794&single=true&output=csv&t=" + Date.now())
    .then(res => res.text())
    .then(text => {

      Papa.parse(text, {
        header: true,
        skipEmptyLines: true,
        complete: function(results) {

          allData = results.data.map(row => ({
            car: row["車輛號碼"] || "",
            radio1: row["RAIDO 1 ID"] || "",
            radio2: row["RAIDO 2 ID"] || "",
            date: row["保養日期"] || "",
            person: row["保養人員"] || "",
            remark: row["備註"] || ""
          }));

          allData.sort((a, b) => {
            const aOk = a.date && a.date.trim() !== "";
            const bOk = b.date && b.date.trim() !== "";
            return aOk - bOk;
          });

          render(allData);
        }
      });

    })
    .catch(err => {
      console.log("CSV 讀取錯誤:", err);
    });
}

function render(data) {
  const tbody = document.getElementById("tbody");
  tbody.innerHTML = "";

  let okCount = 0;
  let noCount = 0;

  data.forEach(item => {
    const ok = item.date && item.date.trim() !== "";

    if (ok) {
      okCount++;
    } else {
      noCount++;
    }

    tbody.innerHTML += `
      <tr>
        <td>${item.car}</td>
        <td>${item.radio1}</td>
        <td>${item.radio2}</td>

        <td class="${ok ? 'ok' : 'no'}">
          ${ok ? "已保養" : "未保養"}
        </td>

        <td>${item.date || "-"}</td>
        <td>${item.person || "-"}</td>
        <td>${item.remark || "-"}</td>
      </tr>
    `;
  });

  // ⭐ 更新統計數字
  document.getElementById("okCount").innerText = okCount;
  document.getElementById("noCount").innerText = noCount;
}

function search() {
  const key = document.getElementById("search").value.toLowerCase();

  const filtered = allData.filter(x =>
    (x.car || "").toLowerCase().includes(key) ||
    (x.radio1 || "").toLowerCase().includes(key) ||
    (x.radio2 || "").toLowerCase().includes(key)
  );

  render(filtered);
}

loadData();
setInterval(loadData, 15000);
</script>

</body>
</html>
