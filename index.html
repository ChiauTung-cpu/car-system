<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>北區保養查詢系統</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f6f9;
  padding: 15px;
  text-align: center;
  margin: 0;
}

.page { display: none; }

button {
  padding: 10px 15px;
  margin: 5px;
  border: none;
  border-radius: 8px;
  background: #3498db;
  color: white;
  cursor: pointer;
  font-size: 14px;
}

button:hover { background: #2980b9; }

.container {
  max-width: 1150px;
  margin: 10px auto;
  background: white;
  padding: 15px;
  border-radius: 12px;
  box-shadow: 0 4px 6px rgba(0,0,0,0.05);
}

.period-group { margin-bottom: 15px; }

.period-btn { background: #7f8c8d; color: white; }
.period-btn.active { background: #27ae60; font-weight: bold; }

.search-box {
  padding: 10px 12px;
  margin-bottom: 15px;
  width: 90%;
  max-width: 320px;
  border: 1px solid #ccc;
  border-radius: 6px;
  font-size: 16px;
}

.user-box {
  background: #eef2f5;
  padding: 10px;
  border-radius: 8px;
  margin-bottom: 15px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-size: 14px;
}

.user-box input {
  padding: 6px 10px;
  border: 1px solid #ccc;
  border-radius: 4px;
  width: 100px;
}

.status-counter { margin: 10px 0; font-size: 15px; }

table { width: 100%; margin-top: 10px; border-collapse: collapse; }
th, td { border: 1px solid #eee; padding: 10px; text-align: center; }
th { background: #f1f3f5; }

.ok { color: green; font-weight: bold; }
.no { color: red; font-weight: bold; }

.card-list { display: none; }

/* 📱 手機版最佳化卡片 */
@media (max-width: 600px) {
  table { display: none; }
  .card-list { display: block; }

  .card {
    background: white;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    padding: 15px;
    margin: 12px 0;
    text-align: left;
    box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .card-info { flex-grow: 1; }
  .title { font-weight: bold; font-size: 18px; margin-bottom: 4px; color: #2c3e50; }
  .small { font-size: 13px; color: #666; margin-top: 3px; }

  /* 勾選按鈕風格 */
  .check-action {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-left: 10px;
  }

  .check-btn {
    background: #e74c3c;
    color: white;
    border: none;
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
  }

  .check-btn.done {
    background: #2ecc71;
  }
}
</style>
</head>

<body>

<!-- 🔘 頂部分頁切換按鈕 -->
<div>
  <button onclick="showPage('stationPage')">轉播站</button>
  <button onclick="showPage('deskPage')">桌上台</button>
  <button onclick="showPage('tunnelPage')">隧道</button>
  <button onclick="showPage('roadPage')">路邊</button>
  <button onclick="showPage('carPage')">車上台</button>
</div>

<!-- 🚗 5. 車上台頁面 -->
<div id="carPage" class="page container">
  <h2>車上台保養紀錄</h2>

  <!-- 同仁姓名預設輸入 -->
  <div class="user-box">
    <label for="staffName">保養人員：</label>
    <input type="text" id="staffName" placeholder="輸入姓名" value="" onchange="saveStaffName(this.value)">
    <span style="font-size: 12px; color: #7f8c8d;">(勾選時自動帶入)</span>
  </div>

  <div class="period-group">
    <button class="period-btn btn-h1" onclick="switchPeriod('carPage', 'H1')">上半年度 (3~8月)</button>
    <button class="period-btn btn-h2" onclick="switchPeriod('carPage', 'H2')">下半年度 (9~2月)</button>
  </div>
  
  <input type="text" class="search-box" placeholder="搜尋車號..." onkeyup="search('carPage', this.value)">
  
  <div class="status-counter">
    未保養：<span id="carPageNoCount" class="no">0</span> 輛 | 
    已保養：<span id="carPageOkCount" class="ok">0</span> 輛
  </div>

  <table>
    <thead>
      <tr>
        <th>車輛號碼</th>
        <th>Radio 1</th>
        <th>Radio 2</th>
        <th>保養狀態</th>
        <th>保養日期</th>
        <th>保養人員</th>
        <th>動作</th>
      </tr>
    </thead>
    <tbody id="carPageBody"></tbody>
  </table>
  <div id="carPageCardList" class="card-list"></div>
</div>

<!-- 其他頁面省略展示但保留功能 -->
<div id="stationPage" class="page container"><h2>轉播站保養紀錄</h2></div>
<div id="deskPage" class="page container"><h2>桌上台保養紀錄</h2></div>
<div id="tunnelPage" class="page container"><h2>隧道保養紀錄</h2></div>
<div id="roadPage" class="page container"><h2>路邊保養紀錄</h2></div>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<script>
// ⚠️ 請將下方的網址替換成你在 Google Apps Script 部署獲得的 Web App URL ⚠️
const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxCpUAclAsDvJwazKFomsbqvjLJKD9-GO9ZfaIdECOzwFWMg5Z0lXs1qtRInJNH65fVGQ/exec"; 

let pageData = {};
let currentPeriods = { carPage: (new Date().getMonth() + 1 >= 3 && new Date().getMonth() + 1 <= 8) ? 'H1' : 'H2' };

const urls = {
  carPage: "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ3uHor4OrU-UeJn83mwQ2HOis4iVD_-6Ia8QNbPtrirGep1KSfdz6f78ZUelaN9P5K0WRxdjgI59a1/pub?gid=327091794&single=true&output=csv"
};

window.addEventListener("DOMContentLoaded", () => {
  // 自動載入預存的保養人姓名
  const savedStaff = localStorage.getItem("staffName") || "";
  document.getElementById("staffName").value = savedStaff;
  showPage("carPage");
});

function saveStaffName(val) {
  localStorage.setItem("staffName", val.trim());
}

function showPage(id) {
  document.querySelectorAll(".page").forEach(p => p.style.display = "none");
  const target = document.getElementById(id);
  if (target) target.style.display = "block";

  if (!pageData[id]) loadData(id);
  else render(id, pageData[id]);
}

function switchPeriod(pageId, period) {
  currentPeriods[pageId] = period;
  if (pageData[pageId]) render(pageId, pageData[pageId]);
}

function loadData(pageId) {
  if (!urls[pageId]) return;
  fetch(urls[pageId] + "&t=" + Date.now())
    .then(res => res.text())
    .then(rawCsv => {
      const cleanCsv = rawCsv.replace(/^[\s,]+\r?\n/g, '');
      Papa.parse(cleanCsv, {
        header: false,
        skipEmptyLines: true,
        complete: function(results) {
          pageData[pageId] = results.data || [];
          render(pageId, pageData[pageId]);
        }
      });
    });
}

function render(pageId, data) {
  if (pageId !== "carPage") return;
  const tbody = document.getElementById("carPageBody");
  const cardList = document.getElementById("carPageCardList");
  tbody.innerHTML = "";
  cardList.innerHTML = "";

  const isH1 = currentPeriods[pageId] === 'H1';

  let renderData = data.filter(r => {
    if (!r || !r.length) return false;
    const rowStr = r.join("").replace(/[\s\u3000]+/g, "");
    if (rowStr.includes("臺北電務段") || rowStr.includes("維護時程表") || rowStr.includes("車輛號碼")) return false;
    return (r[1] || "").trim() !== "";
  });

  // 未保養排前面
  renderData.sort((a, b) => {
    let dateA = isH1 ? (a[7] || "").trim() : (a[9] || "").trim();
    let dateB = isH1 ? (b[7] || "").trim() : (b[9] || "").trim();
    return (dateA !== "" ? 1 : 0) - (dateB !== "" ? 1 : 0);
  });

  let ok = 0, no = 0;

  renderData.forEach(r => {
    let carNo = (r[1] || "").trim();
    let radio1 = (r[2] || "").trim();
    let radio2 = (r[4] || "").trim();
    let date = isH1 ? (r[7] || "").trim() : (r[9] || "").trim();
    let staff = isH1 ? (r[8] || "").trim() : (r[10] || "").trim();
    let done = date !== "";

    done ? ok++ : no++;

    // 電腦版表格
    tbody.innerHTML += `
      <tr>
        <td>${carNo}</td>
        <td>${radio1}</td>
        <td>${radio2}</td>
        <td class="${done ? 'ok' : 'no'}">${done ? '已保養' : '未保養'}</td>
        <td>${date || "-"}</td>
        <td>${staff || "-"}</td>
        <td>
          ${!done ? `<button onclick="submitMaintenance('${carNo}')">標記保養</button>` : '✓'}
        </td>
      </tr>`;

    // 手機版卡片
    cardList.innerHTML += `
      <div class="card">
        <div class="card-info">
          <div class="title">${carNo}</div>
          <div class="small">Radio: ${radio1} / ${radio2}</div>
          <div class="small ${done ? 'ok' : 'no'}">${done ? '已保養 (' + date + ' - ' + staff + ')' : '未保養'}</div>
        </div>
        <div class="check-action">
          <button class="check-btn ${done ? 'done' : ''}" onclick="submitMaintenance('${carNo}')">
            ${done ? '已完成' : '點擊保養'}
          </button>
        </div>
      </div>`;
  });

  document.getElementById("carPageOkCount").innerText = ok;
  document.getElementById("carPageNoCount").innerText = no;
}

// 🚀 勾選並同步上傳至 Google 試算表
function submitMaintenance(carNo) {
  const staffInput = document.getElementById("staffName").value.trim();
  if (!staffInput) {
    alert("請先在上方輸入【保養人員姓名】！");
    return;
  }

  // 自動取得今日日期 (格式：YYYY.MM.DD)
  const now = new Date();
  const year = now.getFullYear();
  const month = String(now.getMonth() + 1).padStart(2, '0');
  const day = String(now.getDate()).padStart(2, '0');
  const todayStr = `${year}.${month}.${day}`;

  if (!confirm(`確定將車號 [${carNo}] 標記為今日 (${todayStr}) 已保養？\n保養人：${staffInput}`)) {
    return;
  }

  const payload = {
    carNo: carNo,
    period: currentPeriods["carPage"],
    date: todayStr,
    staff: staffInput
  };

  // 發送 POST 請求給 GAS
  fetch(GAS_API_URL, {
    method: "POST",
    mode: "no-cors", // 跨域安全設定
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  })
  .then(() => {
    alert("✅ 上傳成功！系統將自動重新整理。");
    // 重新載入最新資料
    loadData("carPage");
  })
  .catch(err => {
    alert("❌ 上傳失敗，請檢查網路狀態：" + err);
  });
}

function search(pageId, k) {
  k = k.toLowerCase().trim();
  const data = pageData[pageId] || [];
  if (!k) return render(pageId, data);
  const filtered = data.filter(r => r && r.join(" ").toLowerCase().includes(k));
  render(pageId, filtered);
}
</script>

</body>
</html>
